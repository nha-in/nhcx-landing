<svg width="1560" height="2218" viewBox="0 0 1560 2218" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- The navy slab. The Figma export drew its grain with feTurbulence and its
     shadow with a 30px feGaussianBlur over the whole 1560x2218 area, which
     made the image so slow to rasterise that scrolling back up to it showed
     a blank band until it was redrawn. The grain is now a small tiled bitmap
     and the shadow is a CSS drop-shadow on the img (styles/landing.css). -->
<defs>
<linearGradient id="slab" x1="768" y1="48" x2="768" y2="2146" gradientUnits="userSpaceOnUse">
<stop offset="0.100962" stop-color="#0C0F23"/>
<stop offset="0.615385" stop-color="#122054"/>
<stop offset="0.884615" stop-color="#152F85"/>
</linearGradient>
<pattern id="grain" patternUnits="userSpaceOnUse" width="128" height="128">
<image href="data:image/png;base64," width="128" height="128" style="image-rendering: pixelated"/>
</pattern>
</defs>
