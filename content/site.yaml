        tag: Standardisation
        ariaLabel: 'Standardisation: every claim speaks the same language'
        sub:
          lead: One standard for every
          accent: claim
          tail: ''
        over:
          before: 'Every '
          strong: claim
          after: ' speaks the same language'
        text: NHCX uses FHIR-based standards and internationally accepted coding practices, so provider and payer systems can exchange health information in a common, machine-readable format, without losing its meaning across systems.
        points:
          - title: One common structure
            text: Health information follows a consistent FHIR-based format.
          - title: Zero ambiguity
            text: Standardised codes preserve the meaning of clinical information.
          - title: Works across systems
            text: Different technology stacks exchange the same information.
      - tone: cool
