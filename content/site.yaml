    understand:
      eyebrow: Understand NHCX
      title: A national exchange for health-claim data, run by the National Health Authority under ABDM
      intro: The National Health Claims Exchange is the digital gateway between the people who deliver care and the people who pay for it. A hospital submits a claim once, as coded FHIR data; the exchange checks and signs it, finds the payer, and delivers it. The decision comes back the same way. It began as the Health Claims Platform (HCP) and was renamed NHCX on the industry’s suggestion; its specifications were developed in the open with insurers, TPAs and state health agencies.
      participantsTitle: Who takes part
      participants:
        - icon: provider
          title: Providers
          text: Hospitals, clinics and the HMIS vendors who build for them.
        - icon: payer
          title: Payers
          text: Insurers, TPAs, state health agencies and schemes like PM-JAY.
        - icon: regulator
          title: Sponsors and regulators
          text: Scheme planners, IRDAI and auditors, on aggregate anonymised views.
        - icon: person
          title: Beneficiaries
          text: Patients, authenticated by ABHA, whose consent governs what an app sees.
      useCasesTitle: What moves over it
      useCases:
        - icon: eligible
          name: Coverage eligibility
          path: /coverageeligibility/check
          what: Is this person covered for this treatment, today?
        - icon: stamp
          name: Pre-authorisation
          path: /preauth/submit
          what: Approve a package and amount before admission.
        - icon: document
          name: Claim
          path: /claim/submit
          what: "The discharge bundle: diagnosis, procedures, bill lines."
        - icon: receipt
          name: Payment notice
          path: /paymentnotice/request
          what: Settlement advice, from payer to provider.
        - icon: messages
          name: Communication
          path: /communication/request
          what: Queries and supporting documents, both ways.
      note:
        - "Every request has an "
        - code: on_
        - " callback, and every message is a signed, encrypted envelope (JWE) around an HL7 FHIR R4 bundle. "
      whyTitle: Why it matters
      why:
        - icon: braces
          title: Structured, not scanned
          text: Claims arrive as coded data, so routine cases auto-adjudicate and queries drop.
        - icon: trend
          title: Lower cost and time
          text: Automation cuts processing cost, turnaround and manual error.
        - icon: vault
          title: Records stay with the hospital
          text: Clinical and financial records never leave your systems. Only claim data moves, into billing and accounts.
        - icon: signed
          title: Open and non-repudiable
          text: Open APIs, signed events, a queryable audit log and a public registry.
