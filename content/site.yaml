        href: /
      - label: PMJAY
        href: /pmjay/
      - label: DevTools
        href: /devtools/
      - label: AI Skill
        href: /skill/
        glow: true
      - label: Links
        href: /links/

  footer:
    managedBy:
      label: Website Content Managed by
      value: National Health Authority (NHA)
    email:
      label: Email
      address: webmaster-pmjay@nha.gov.in
    address:
      label: Postal Address
      value: 9th Floor, Tower-I, Jeevan Bharati Building, Connaught Place, New Delhi – 110001
    tollFree:
      label: Toll-Free Call Center No
      value: 'NHA/PM-JAY : 14555 | ABDM : 14477'
    updatedLabel: Last Updated on
    linksTitle: Important Links
    links:
      - label: Ministry of Health and Family Welfare
        href: https://mohfw.gov.in/
      - label: NITI Aayog
        href: https://www.niti.gov.in/
      - label: National Health Authority (NHA)
        href: https://nha.gov.in/
      - label: Ayushman Bharat Digital Mission (ABDM)
        href: https://abdm.gov.in/
      - label: PM-JAY
        href: /pmjay/
    policiesTitle: Policies
    policies:
      - label: Terms & Conditions
        href: /policies/terms/
      - label: Whistle Blower Policy
        href: /policies/whistle-blower/
      - label: Website Policy
        href: /policies/website/
