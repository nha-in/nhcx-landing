    - __component: sections.split-benefits
      anchor: structured
      eyebrow: WHY FHIR MATTERS
      title: Structured health records pay off on both sides of the claim
      intro: A scanned discharge summary is a document someone has to read. The same record as a FHIR bundle is data a system can price, check and settle. That single difference is what changes the economics of a claim for the hospital and for the payer alike.
      columns:
        - audienceLabel: FOR THE PROVIDER
          heading: Faster money, less paperwork
          cards:
            - title: Cash cycle shortens
              description: Pre-auth answers arrive in hours and settlement in days, so working capital is not tied up in pending claims.
            - title: No document chase
              description: Codes, bill lines and supporting records travel with the claim, so far fewer queries and resubmissions come back.
            - title: One integration, every payer
              description: The HMIS speaks the protocol once instead of maintaining a portal workflow per insurer and scheme.
            - title: Fewer avoidable rejections
              description: "Validation happens at submission, not weeks later: errors surface while the claim is still fixable."
        - audienceLabel: FOR THE PAYER
          heading: Decisions at machine speed
          cards:
            - title: Straight-through processing
              description: Coded diagnoses and itemised charges let rules engines price routine claims without a human touching them.
            - title: Fraud and abuse caught early
              description: Signed, de-duplicated, traceable exchanges make upcoding, repeat billing and impossible combinations visible.
            - title: Lower cost per claim
              description: Adjudicators spend their time on genuine exceptions instead of re-keying data from PDFs.
            - title: Analytics that hold up
              description: Consistent codes across every provider make utilisation, package pricing and network performance comparable.
      traits:
        - title: Interoperable
          description: "FHIR R4 profiles from the ABDM implementation guide: the same bundle any participant can read."
        - title: Machine-readable
          description: Every element coded and typed, so systems act on it without interpretation or manual entry.
        - title: Auditable
          description: Both sides hold a signed, timestamped record of exactly what was sent and decided.
        - title: Portable for the patient
          description: The same structured record carries into the patient's health account rather than staying locked in one hospital.
