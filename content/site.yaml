    caption: Watch how NHCX connects payers, providers and TPAs on one standardised network, so a claim moves from admission to settlement without leaving the system. Every pre-authorisation, claim and settlement travels as structured FHIR data through a single gateway, giving hospitals faster approvals, insurers cleaner data and patients a clear view of where their claim stands at each step.

  how:
    title: How NHCX works
    lede: Idea is to transmit the health information that is already generated by a Provider hospital in digitized format to an Insurer without losing any of its essence,
    ledeTail: and that too in a protocol standard set by the Payer beforehand.
    cta:
      label: View Docs →
      href: /docs/
