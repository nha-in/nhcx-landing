      - Insurance plan / package master
      - Status and search
      - Notifications and subscriptions
    documentsNote: Attach the registration certificate for a company, LLP or firm (CIN or LLPIN) or PAN and address proof for an individual or proprietorship. PDF, PNG or JPG, up to 10 MB each.
    consentText: I confirm that the details above are accurate, that I am authorised to apply on behalf of the organisation named, and I agree to the sandbox terms of use and privacy policy below.
    submitLabel: Submit application
    successTitle: Application received
    successText: "Keep this application ID safe: together with the email address you used, it lets you track the review on the status page. The onboarding desk typically responds within two working days."
    errorText: The application could not be submitted because the exchange's content service is not reachable right now. Nothing was sent. Please try again in a few minutes; if the problem persists, write to the onboarding desk with the details you entered.
    privacyTitle: Privacy policy
    privacyText: The details you submit are used only to assess and process your sandbox access application and to contact you about it. They are stored by the National Health Authority's sandbox onboarding desk, are not shared with third parties, and are removed when the application is withdrawn or the sandbox account is closed. Uploaded documents are visible only to reviewers.
    termsTitle: Terms of use
    termsText: The NHCX sandbox is a test environment. It holds no real beneficiary, policy or claim data and must not be sent any. Access is granted to named participants for integration and certification, may be revoked for misuse, and carries no service-level commitment. Passing the sandbox exit checklist is a prerequisite for, not a guarantee of, production onboarding.
