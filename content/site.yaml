    payers:
      - Insurance Company
      - TPA
      - State Health Agency
      - Government Scheme

  flow:
    title: How a typical flow looks like
    labels:
      start: HMIS
      hub: NHCX
      end: PAYER
    steps:
      - tag: 01 · HMIS / LMIS / RIS / EMR
        title: Patient Records
        text: Clinical Notes, Treatment Plan, Procedure Details, Diagnostic Reports, Discharge Summary and Itemized Bill sent to Payer addressee.
        tick: HMIS / EMR
      - tag: 02 · In Transit
        title: Schema checked and validated
        text: The structured information enters pipeline as an encrypted payload in FHIR R4 format with due digital authorization from both sender and receiver.
        tick: In transit
      - tag: 03 · NHCX Gateway
        title: Record transaction and Deliver
        text: NHCX maintains log of transaction about sender and receiver from Participant IDs and the purpose of the transaction from Workflow ID and forwards to the Beneficiary.
        tick: NHCX Gateway
      - tag: 04 · Payer Engine
        title: Claim Processing
        text: Payer matches the data received against its existing records and adjudicates the claim easily based on the every minute details made available.
        tick: Payer engine
      - tag: 05 · The Response
        title: Communication of Decision
        text: The return leg follows the same sets of protocol in the reverse direction with Provider receiving a callback.
        tick: The response

  ai:
    title: Your NHCX Integration now made easy with AI
    lede: Make the best use of an omnipotent AI Tool that understands the entire communication protocol, FHIR bundles, flow wise use cases and probable errors, besides generating codes for you.
    demo:
