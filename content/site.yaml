pmjay:

  meta:
    title: PM-JAY on NHCX · National Health Claims Exchange
    description: 'What PM-JAY is, and what its claims look like once they travel over NHCX: the cover, the benefits, what a hospital does differently, and how a scheme claim travels.'

  hero:
    kicker: PMJAY | Pradhan Mantri Jan Arogya Yojana
    titleLead: The world’s largest health scheme, is on
    titleAccent: NHCX
    lede: Pradhan Mantri Jan Arogya Yojana gives eligible families cashless secondary and tertiary treatment at empanelled hospitals.
    knowMore:
      label: Know more
      href: https://beneficiary.nha.gov.in/
    about:
      label: About PM-JAY
      href: '#pmjay-on-nhcx'
    emblemAlt: Ayushman Bharat PM-JAY emblem

  facts:
    title: PMJAY sits on NHCX like any other payer - same cover, same cashless treatment, raised and settled through the exchange
    items:
      - icon: cover
        lead: ₹5 lakh per family, per year
        text: Cover for secondary and tertiary hospitalisation for every eligible family, with no premium to pay at the point of care.
        link: About the cover
        href: '#pmjay-benefits'
      - icon: cashless
        lead: Cashless at the hospital
        text: An empanelled hospital treats and discharges the patient, then raises the claim over NHCX instead of a payer-specific portal.
        link: How a claim travels
        href: '#pmjay-travels'
      - icon: states
        lead: Run by NHA with the states
        text: The National Health Authority runs PM-JAY and the exchange nationally; each State Health Agency runs the scheme in its own state.
        link: Read the specification
        href: /docs/

  benefits:
    title: PMJAY Benefits
    items:
      - icon: cover
        title: Cover a family can use
        text: Up to ₹5 lakh per family per year for secondary and tertiary hospitalisation, with no premium to pay at the point of care.
      - icon: cashless
        title: Cashless at the hospital
        text: An eligible patient is treated and discharged without paying the hospital; the claim is settled between the hospital and the scheme afterwards.
      - icon: states
        title: Run by NHA with the states
        text: The National Health Authority runs PM-JAY nationally, and each State Health Agency runs it in its own state, with its own empanelment and its own claim processing.
    card:
      cover: 500000
      claimed: 142500
      hintFront: Hover the card to flip it
      hintBack: Balance after two claims
      backLabel: Cover used this year
      note: Illustrative figures. No beneficiary details are shown on this page.
      ariaLabel: Ayushman card. Activate to see the cover used this year.
      band: आयुष्मान कार्ड / AYUSHMAN CARD
      rows:
        - नाव / NAME
        - जन्म वर्ष / YOB
        - गाव / VILLAGE
        - तालुका / TOWN
        - जिल्हा / DISTRICT
      coverLine: ₹5 लाखां
      coverNote: मोफत उपचार
      state: 'State: MAHARASHTRA'
      ids:
        - ABHA NUMBER
        - PM-JAY ID
        - RATION CARD
      foot:
        - आयुष्मान भारत प्रधानमंत्री जन आरोग्य योजना
        - AYUSHMAN BHARAT PRADHAN MANTRI – JAN AROGYA YOJANA
      remainingOf: remaining of
      claimedLabel: Claimed
      staysLabel: Hospitalisations
      stays: 2
      paidLabel: Paid at hospital
      paid: ₹0

  changed:
    title: Three things a hospital does differently
    sub: The scheme is the same and so is the cover. What changes is where the claim is raised, how the patient is proved to be the beneficiary, and what happens to a claim that arrives clean.
    items:
      - icon: hmis
        title: Raised in your HMIS
        text: The claim is composed in the software the hospital already runs, from the diagnosis, procedure and bill lines it already holds. No second data entry, no staff switching systems to submit what has just been recorded.
      - icon: biometric
        title: Beneficiary verified by biometrics
        text: The patient is authenticated against their Ayushman record at the hospital, so who was treated is settled at the point of care rather than queried weeks later against a paper trail.
      - icon: settle
        title: Prioritised settlement
        text: A claim that arrives coded, complete and validated can be priced against the scheme’s rules as it lands, so the straightforward majority settle first and human review is spent on the cases that need it.

  travels:
    titleLead: How a scheme claim
    titleAccent: travels
    sub: The same four moves every claim makes, with the standards doing the work in between. Nothing here is particular to one hospital’s software or one state’s claim system.
    steps:
      - title: The hospital raises the claim
        text: The HMIS gathers what the ward already recorded (diagnosis, procedure, drugs and implants, bill lines) into one structured FHIR bundle, rather than a folder of scans.
        window:
          kind: collect
          heading: Patient record
          subheading: FHIR claim bundle
          items:
            - icon: diagnosis
              title: Diagnosis
              detail: Osteoarthritis of the knee
              resource: Condition
            - icon: procedure
              title: Procedure
              detail: Total knee replacement
              resource: Procedure
            - icon: drugs
              title: Drugs and implants
              detail: An implant and 5 drugs
              resource: Medication
            - icon: bill
              title: Bill lines
              detail: 12 lines · ₹1,42,500
              resource: Claim
          ready:
            title: Claim bundle ready
            summary: Composed from records already on file
      - title: NHCX carries it
        text: The bundle is signed and encrypted, and the exchange routes it to the right payer for that patient and that state, handing the hospital a receipt it can quote later.
        window:
          kind: travel
          nodes:
            - Hospital
            - NHCX
            - Payer
          items:
            - icon: sign
              title: Signed
              detail: As the hospital
            - icon: lock
              title: Encrypted
              detail: Only the payer can open it
            - icon: route
              title: Routed
              detail: To the State Health Agency
            - icon: delivered
              title: Delivered
              detail: Receipt back to the hospital
          ready:
            title: Delivered to the payer
            summary: Receipt kept against the claim ID
      - title: The payer approves
        text: The State Health Agency or its insurer reads a machine-readable claim, so a routine case is checked and priced by rules, and only the ones that need a person get one.
        window:
          kind: approve
          heading: CLM-2026-004217
          subheading: Total knee replacement
          amount: 142500
          stampLabel: Decision
          stamp: Approved
          items:
            - title: Beneficiary
              detail: E-card active, cover left
            - title: Package rules
              detail: Within package limits
            - title: Documents
              detail: All mandatory documents
            - title: Pricing
              detail: At the package rate
          ready:
            title: Approved in full
            summary: A routine case, checked and priced by rules
      - title: The payment comes home
        text: The payment notice returns on the same rail against the same claim ID. The HMIS acknowledges it and marks the claim settled, without a phone call.
        window:
          kind: payment
          heading: Payment received
          subheading: CLM-2026-004217 · Total knee replacement
          amount: 142500
          items:
            - icon: sent
              title: Claim sent
              detail: Over NHCX
            - icon: decision
              title: Approved
              detail: By the payer
            - icon: amount
              title: Payment notice
              detail: Read by the HMIS
            - icon: settle
              title: Acknowledged
              detail: Claim settled
          ready:
            title: Claim settled
            summary: Payment credited to the hospital
    footLabel: Claim journey

  sides:
    title: What each side gets
    hospitalsTitle: For hospitals
    art:
      hospital: Hospital
      hub: NHCX
      hubNote: one bundle
      payers:
        - PM-JAY
        - State scheme
        - Private Payer
    hospitals:
      - 'One integration, not one per payer: the same bundle format serves PM-JAY, state schemes and private insurers.'
      - Claims validated before they leave, so incomplete ones are caught at the desk instead of coming back as queries weeks later.
      - A readable trail for every claim, which is what a disputed settlement actually turns on.

  cta:
    title: Connecting a PM-JAY hospital or payer
    sub: 'Integration is the same for a scheme claim as for any other: read the specification, build a bundle that validates, rehearse the whole flow against the sandbox, then apply for the environment you need.'
    label: Apply for access
    href: /apply/

# ——————————————————————————————————————————————————————————————————————
# The DevTools page (/devtools/). The adapter download list itself is generated into lib/adapter-release.ts.
# ——————————————————————————————————————————————————————————————————————
devtools:

  meta:
    title: DevTools · NHCX
    description: 'Two developer tools for NHCX: DevTools, which teaches and rehearses the exchange in a browser, and the NHCX Adapter, the binary that carries it in production.'

  url: https://nhcx.sbxstage.in/dev

  hero:
    kicker: Developer tools for NHCX
    titleLead: Build against NHCX
    titleAccent: before you connect to it
    intro: 'Two tools and no third thing to choose between: one that teaches and rehearses the exchange in a browser tab, one that carries it in production.'
    consoleCard:
      title: DevTools
      copy: 'The exchange end to end, in a tab: read how an endpoint behaves, build a bundle that validates, and trade claims with a mock payer until every flow passes. Nothing you do here touches your servers.'
      ctaLabel: Open DevTools
    adapterCard:
      title: NHCX Adapter
      copy: The piece you actually deploy. Post a FHIR bundle to it, read a plain callback back, and it does the headers, the encryption, the certificates and the acknowledgements in between. One JSON config, no database.
      downloadPrefix: Download
      repoLabel: GitHub
    flow:
      - Your system
      - NHCX Adapter
      - NHCX

  console:
    title: DevTools
    intro: The whole exchange in a browser tab. Nothing you do here touches your servers.
    ctaLabel: Open DevTools
    useCasesTitle: What you’d use DevTools for
    useCases:
      - icon: book
        title: Starting from zero
        text: Fourteen chapters across two tracks, from what the exchange is to how a claim settles, each ending in a short check that remembers where you got to.
      - icon: braces
        title: Preparing your first claim
        text: Compose eligibility, pre-authorisation, claim and payment bundles against the ABDM profiles, and find what is wrong before a real send does.
      - icon: play
        title: Testing with no counterparty
        text: A mock payer answers, so a whole flow runs end to end before anyone assigns you a partner. When one fails, the decrypted request and callback are both there.

  adapter:
    title: NHCX Adapter
    introBefore: 'One binary between your system and NHCX. Your software posts a FHIR bundle to it and reads a plain callback back; the adapter does the '
    introCode: x-hcx-*
    introAfter: ' headers, the encryption, the certificates and the acknowledgements. Nothing else about your system changes.'
    useCasesTitle: What you’d use the adapter for
    useCases:
      - icon: plug
        title: Put an existing system on NHCX
        text: Your HMIS or claims software posts a bundle to one local endpoint and reads plain JSON back. Nothing inside it learns the protocol, and one adapter can carry several participant codes.
      - icon: rocket
        title: Move from sandbox to production
        text: One switch in config.json. The same calls and the same endpoints, pointed at the other environment’s registry and credentials.
      - icon: search
        title: Settle a disputed claim
        text: Pull the exact request and callback for a correlation id months later, decrypted and readable, and replay it if the payer asks.
    downloadsTitle: Download the NHCX Adapter
    releasedPrefix: released

  quickstart:
    title: Run it
    shellGroupLabel: Shell
    copyLabel: Copy
    copiedLabel: Copied
