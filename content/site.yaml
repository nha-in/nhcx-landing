  pmjay:
    meta:
      title: PM-JAY on NHCX
      description: "Ayushman Bharat PM-JAY gives eligible families cashless treatment at empanelled hospitals. NHCX is the exchange those claims can travel on: one standard message from hospital to payer and back."
    hero:
      eyebrow: Ayushman Bharat · PM-JAY
      titleLead: The world’s largest health scheme,
      titleAccent: is on NHCX
      lede: "Pradhan Mantri Jan Arogya Yojana gives eligible families cashless secondary and tertiary treatment at empanelled hospitals. NHCX is the rail those claims travel on: one standard message, one set of rules, and a claim raised in the hospital’s own HMIS instead of re-keyed into a separate portal."
      primaryLabel: Get sandbox access
      secondaryLabel: About PM-JAY
      secondaryHref: https://pmjay.gov.in
      emblemAlt: Ayushman Bharat PM-JAY emblem
    facts:
      eyebrow: The scheme
      title: What PM-JAY is
      items:
        - title: Cover a family can use
          text: Up to ₹5 lakh per family per year for secondary and tertiary hospitalisation, with no premium to pay at the point of care.
        - title: Cashless at the hospital
          text: An eligible patient is treated and discharged without paying the hospital; the claim is settled between the hospital and the scheme afterwards.
        - title: Run by NHA with the states
          text: The National Health Authority runs PM-JAY nationally, and each State Health Agency runs it in its own state, with its own empanelment and its own claim processing.
    changed:
      eyebrow: What has changed
      title: Three things a hospital does differently
      lede: The scheme is the same and so is the cover. What changes is where the claim is raised, how the patient is proved to be the beneficiary, and what happens to a claim that arrives clean.
      items:
        - was: Re-keyed into a separate claims portal
          now: Raised in your HMIS
          text: The claim is composed in the software the hospital already runs, from the diagnosis, procedure and bill lines it already holds. No second data entry, no staff switching systems to submit what has just been recorded.
        - was: Identity argued at settlement
          now: Beneficiary verified by biometrics
          text: The patient is authenticated against their Ayushman record at the hospital, so who was treated is settled at the point of care rather than queried weeks later against a paper trail.
        - was: One queue for every claim
          now: Prioritised settlement
          text: A claim that arrives coded, complete and validated can be priced against the scheme’s rules as it lands, so the straightforward majority settle first and human review is spent on the cases that need it.
    journey:
      eyebrow: On the exchange
      titleLead: How a scheme claim
      titleAccent: travels
      text: The same four moves every claim makes, with the standards doing the work in between. Nothing here is particular to one hospital’s software or one state’s claim system.
      steps:
        - title: The hospital raises the claim
          text: The treating hospital composes the claim from what it already recorded (diagnosis, procedure, drugs, bill lines) as one structured FHIR bundle rather than a folder of scans.
        - title: NHCX carries it
          text: The exchange routes the bundle to the right payer for that patient and that state, signed and encrypted, and hands back a receipt the hospital can quote later.
        - title: The payer decides
          text: The State Health Agency or its insurer reads a machine-readable claim, so routine cases can be priced by rules and only the ones that need a human get one.
        - title: The answer comes home
          text: Approval, query or rejection returns on the same rail against the same claim id, so the hospital knows where every claim stands without a phone call.
    sides:
      eyebrow: Both ends of the claim
      title: What each side gets
      groups:
        - who: For hospitals
          items:
            - "One integration, not one per payer: the same bundle format serves PM-JAY, state schemes and private insurers."
            - Claims validated before they leave, so incomplete ones are caught at the desk instead of coming back as queries weeks later.
            - A readable trail for every claim, which is what a disputed settlement actually turns on.
        - who: For State Health Agencies and insurers
          items:
            - Coded clinical data instead of scanned paper, so adjudication rules can run on the claim as it arrives.
            - The same message shape from every empanelled hospital, whatever software that hospital runs.
            - Faster, more traceable settlement, and fewer cycles spent asking hospitals for what was already sent.
    start:
      eyebrow: Start here
      title: Connecting a PM-JAY hospital or payer
      lede: "Integration is the same for a scheme claim as for any other: read the specification, build a bundle that validates, rehearse the whole flow against the sandbox, then apply for the environment you need."
      applyLabel: Apply for access
      consoleLabel: Open DevTools
