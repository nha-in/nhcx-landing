# Every word and link on the NHCX site.
#
# Edit a value here and the page changes: `npm run dev` picks it up as you
# save, and `npm run build` bakes it into the static export. Keep the keys
# as they are; the components find the words by them.
#
# - Links that start with / are pages on this site (the base path is added
#   for you); anything else opens as written.
# - In home.benefits.cards, *stars* mark the words shown in the accent colour.
# - {year} in site.footer.copyright is replaced with the current year.

# ——————————————————————————————————————————————————————————————————————
# Every page: the browser tab title and description, the header, the footer, and the Copy button.
# ——————————————————————————————————————————————————————————————————————
site:

  meta:
    title: National Health Claims Exchange
    description: NHCX brings India’s healthcare ecosystem together with standardized, interoperable claim data — enabling seamless, transparent, and efficient exchange across systems.

  header:
    homeLabel: NHCX home
    markAlt: HCX
    logoLabel: National Health Authority — ABDM NHCX
    logoAlt: National Health Authority, Ayushman Bharat Digital Mission
    navLabel: Primary
    nav:
