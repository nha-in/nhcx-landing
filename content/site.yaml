  skill:
    meta:
      title: NHCX is one prompt away · AI skill
      description: "An agent skill that teaches your coding assistant the National Health Claim Exchange: the protocol, the FHIR bundles, the envelope and the sandbox, so an integration can be asked for rather than assembled by hand."
    skillUrl: https://github.com/nha-in/nhcx-skill
    install: git clone https://github.com/nha-in/nhcx-skill .claude/skills/nhcx
    hero:
      eyebrow: Agentic AI for NHCX
      titleLead: NHCX is
      titleAccent: one prompt away
      lede: "An agent skill that teaches the coding assistant you already use what the exchange actually is: its endpoints and callbacks, the FHIR bundle behind each flow, the envelope that carries it, and a sandbox to try the whole thing against. You describe the claim. It writes the integration and proves it."
      skillCtaLabel: Get the skill
      consoleCtaLabel: Open DevTools
      chips:
        - runs in your editor
        - sandbox first
        - cites the spec
        - no new SDK
    terminal:
      tag: working
      foot:
        - sandbox credentials
        - spec cited
        - nothing sent without you
      transcripts:
        - prompt: Send a pre-authorisation for a cataract day-care admission to the sandbox.
          steps:
            - "read the pre-authorisation cycle: request, acknowledgement, callback"
            - "composed the bundle: Claim, Coverage, Patient, Organization"
            - validated against the ABDM profiles, no errors
            - posted to the sandbox and waited for the callback
          reply: The mock payer approved it in 4.2 seconds. The request, the callback and the decrypted payload are written to nhcx/preauth-01/ so you can read what actually went over the wire.
        - prompt: This claim came back rejected. Tell me what to fix.
          steps:
            - decrypted the callback and read the error block
            - matched the code against the error catalogue
            - traced it to one bill line with no coded product
            - patched the bundle and revalidated it
          reply: The envelope was fine; the payer rejected the content. One item carried a description but no code, so it could not be priced. It is coded now and the bundle validates, ready to resend.
        - prompt: Wire our hospital system to NHCX and prove it end to end.
          steps:
            - generated the adapter configuration from your endpoints
            - checked the certificates and the participant code
            - ran eligibility, pre-authorisation, claim and payment notice
            - all four flows settled against the mock payer
          reply: Four flows pass. Your system keeps posting plain JSON to one local endpoint; the encryption, the protocol headers and the acknowledgements all happen inside the adapter.
        - prompt: What changes when we move this integration to production?
          steps:
            - listed every value that differs from the sandbox
            - diffed your configuration against the production shape
            - flagged two secrets still sitting in the repository
            - wrote the cutover as a checklist
          reply: Nine values change and two of them are secrets that should never have been committed. The checklist is in MOVE-TO-PRODUCTION.md, each line pointing at the part of the specification behind it.
    loop:
      eyebrow: How it works
      titleLead: It reads before it writes, and
      titleAccent: runs before it claims
      text: "An answer you cannot check is worth little on a network that settles money. The skill works in a loop: study the rule, build the request, test it against the ABDM profiles, run it against the sandbox, and go round again until the flow passes or it can tell you exactly why it will not."
      ringNodes:
        - study
        - build
        - test
        - run
      phases:
        - title: Study
          text: "It pulls the part of the specification the task needs: the flow, the endpoints it uses, the profile each bundle has to satisfy. Nothing is answered from memory."
        - title: Build
          text: It writes the request in your project, in the language and the shape already there, instead of pasting a sample that assumes somebody else’s stack.
        - title: Test
          text: The bundle goes against the ABDM profiles and the envelope against the protocol at your desk, so a malformed claim is caught before it is anyone else’s problem.
        - title: Run
          text: It sends to the sandbox, waits for the asynchronous callback, decrypts it and reads it. A failure is the next input rather than the end of the attempt.
    knows:
      eyebrow: What it carries
      titleLead: Not a chat window.
      titleAccent: The exchange, in a form an agent can act on
      ledeParts:
        - The NHCX specification, compiled into instructions an assistant follows rather than pages a person reads.
      cards:
        - tag: protocol
          title: The exchange itself
          text: Which call starts a flow, which acknowledgement comes back on the same connection, and which answer arrives later on your callback endpoint. The asynchronous shape of NHCX is the part integrations get wrong first.
        - tag: fhir
          title: The bundle behind each flow
          text: Eligibility, pre-authorisation, claim and payment notice, each as the FHIR resources the ABDM profiles require, with the fields that must be coded rather than typed.
        - tag: envelope
          title: Signing and encryption
          text: How a payload is encrypted for one recipient, what the protocol headers carry, and which key the other participant will use to open it.
        - tag: errors
          title: What a rejection means
          text: The error codes and their real causes, so a returned claim reads as an instruction (this field, this value, this fix) instead of a wall.
        - tag: sandbox
          title: Where to try it
          text: How sandbox access is granted, what the mock payer will answer, and every value that changes on the day you point the same code at production.
        - tag: adapter
          title: The adapter you deploy
          text: "The one binary that sits between a hospital system and the exchange: its configuration, the endpoints it exposes inward, and how to run it beside software you are not allowed to rewrite."
    prompts:
      eyebrow: Try it
      titleLead: Prompts that are
      titleAccent: a whole task
      text: Copy one into the assistant in your editor. Each of these ends in something you can run, not in a paragraph explaining what you could run.
      items:
        - "Set up NHCX in this repository: sandbox config, a callback endpoint, and one eligibility check that passes."
        - Build a pre-authorisation bundle for a cataract day-care admission and validate it against the ABDM profiles.
        - This callback came back rejected. Decrypt it, tell me which field is wrong, and fix the bundle.
        - Add the NHCX adapter beside our existing hospital system without changing how the HIS posts a claim.
        - List everything that changes when we move this integration from the sandbox to production.
    rules:
      eyebrow: Limits
      titleLead: The rules it
      titleAccent: works under
      text: An agent with credentials on a national network needs a shorter leash than one writing a landing page. These are the four it is held to.
      items:
        - title: Sandbox until you say otherwise
          text: The skill points at the sandbox. Production is a thing you ask for in words, not a default it can wander into.
        - title: Your machine, your data
          text: It works in your repository with your credentials. Nothing about a patient goes anywhere except to the exchange you addressed it to.
        - title: Every rule comes with its source
          text: A field is required because a named section of the specification says so, and the answer says which section. You can check it without trusting it.
        - title: It stops rather than invents
          text: Where the specification is silent or the sandbox disagrees with it, the skill says so and hands the decision back, instead of filling the gap with a plausible field name.
    close:
      eyebrow: Get started
      titleLead: Bring it into
      titleAccent: your editor
      lede: The skill is a folder of instructions and specifications in your project. Any assistant that reads skills from the repository picks it up; nothing else about your setup changes.
      skillCtaLabel: The skill on GitHub
      consoleCtaLabel: Rehearse in DevTools
      applyCtaLabel: Apply for sandbox access
      noteParts:
        - "You still need credentials to send anything: the skill writes and validates without them, and the sandbox answers once your application is through."
