  getStarted:
    meta:
      title: Get started · NHCX
      description: The path onto the National Health Claim Exchange, from sandbox registration to production, for providers and for payers.
    eyebrow: Before you write any code
    title: Get started on NHCX
    lede: Four stages take any participant from registration to production. What you build inside them depends on which half of a claim you handle, so say which you are and the stages fill in.
    question: Which side of a claim are you on?
    changeLabel: Not you? Choose again
    roles:
      - key: provider
        label: Provider
        note: A hospital, clinic, nursing home or day care centre, or the HMIS or TMS vendor building for one. You raise claims.
        flowTitle: The provider route
        steps:
          - title: Register on the ABDM sandbox
            text: Fill in the sandbox registration form to get your credentials and participant code. The exchange addresses you by that code, so one integration reaches every payer on it.
          - title: Send what your system already holds
            text: The diagnosis, procedure, bill lines and codes your HMIS already records become one signed FHIR bundle. Nothing is re-keyed and nothing is scanned.
          - title: Build the raising half of the flow
            text: Check coverage eligibility, raise the pre-auth, submit the claim, and read the payment notice that comes back. Each one is a request you send and a callback you handle.
          - title: Certify, then apply for production
            text: Complete the functional and security test cases for the provider role in the sandbox, then submit both certificates. NHCX assigns your production role and credentials.
      - key: payer
        label: Payer
        note: An insurer, TPA, state health agency or government scheme such as PM-JAY. You adjudicate claims.
        flowTitle: The payer route
        steps:
          - title: Register on the ABDM sandbox
            text: Fill in the sandbox registration form to get your credentials and participant code. Providers reach you by that code, so one integration serves all of them.
          - title: Make your rules readable to the exchange
            text: Plans, package rates and the checks you apply become rules a request can be matched against, so a clean claim is decided without anyone opening an attachment.
          - title: Build the answering half of the flow
            text: Receive eligibility checks, pre-auth requests and claims, respond on each, and send the payment notice. Each one is a request you handle and a callback you send.
          - title: Certify, then apply for production
            text: Complete the functional and security test cases for the payer role in the sandbox, then submit both certificates. NHCX assigns your production role and credentials.
    bothTitle: True whichever you are
    both:
      - You build against NHCX once and reach every counterparty on it, instead of integrating with each payer or hospital in turn.
      - The sandbox is free and open before you apply for anything, so you can read the specification by building against it.
      - Certification is per role. A vendor building for both sides certifies for both.
    ctaLabel: Apply for access
    ctaHref: /apply/
