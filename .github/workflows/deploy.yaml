name: Build & Deploy

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: deploy-s3-${{ github.ref_name }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  IS_PROD: ${{ github.ref_name == 'main' }}

jobs:
  deploy:
    name: Deploy to ${{ github.ref_name == 'main' && 'production' || 'development' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          set -euo pipefail
          aws s3 sync out/ "s3://${S3_BUCKET}/" --delete

      - name: Invalidate CloudFront cache
        id: invalidate
        env:
          DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
          PATHS: ${{ vars.INVALIDATION_PATHS || '/*' }}
        run: |
          set -euo pipefail
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "$PATHS" \
            --query 'Invalidation.Id' --output text)
          echo "Invalidation: $INVALIDATION_ID"
          echo "id=$INVALIDATION_ID" >> "$GITHUB_OUTPUT"

          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION_ID" \
            --id "$INVALIDATION_ID"
          echo "Invalidation completed"

      - name: Summary
        if: always()
        env:
          ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'development' }}
        run: |
          {
            echo "### Deploy — \`${ENVIRONMENT}\`"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Status | ${{ job.status == 'success' && 'Deployed' || 'Failed' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
