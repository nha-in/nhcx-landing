<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>NHCX site content</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div id="login" hidden>
      <form id="login-form">
        <h1>NHCX site content</h1>
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required />
        <button type="submit">Sign in</button>
        <p id="login-error" class="error" hidden></p>
      </form>
    </div>

    <div id="app" hidden>
      <header>
        <b>NHCX site content</b>
        <nav id="tabs"></nav>
        <span class="spacer"></span>
        <span id="dirty" class="pill" hidden>unsaved changes</span>
        <button id="save" type="button" class="primary" disabled>Save</button>
        <button id="publish" type="button">Publish</button>
      </header>

      <main>
        <p id="blurb" class="blurb"></p>
        <div id="editor"></div>
      </main>

      <aside id="log" hidden>
        <div class="log-head">
          <b>Publishing</b>
          <button id="log-close" type="button" aria-label="Close">✕</button>
        </div>
        <pre id="log-body"></pre>
      </aside>

      <div id="toast" class="toast" hidden></div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
